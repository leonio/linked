name: Side-by-side builds

# Started by hand (Actions > Side-by-side builds > Run workflow). Builds the C# app and the Rust app at the
# same commit and publishes one zip per app and architecture, named with the version you give, so the two
# can be downloaded, run and measured next to each other.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version for the file names and the C# build, for example 0.2.0"
        required: true
        type: string
      publish_release:
        description: "Also create a GitHub Release (tag v<version>) with the zips attached"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            platform: x64
            target: x86_64-pc-windows-msvc
            os: windows-latest
          - rid: win-arm64
            platform: ARM64
            target: aarch64-pc-windows-msvc
            os: windows-11-arm
    steps:
      - uses: actions/checkout@v4

      - name: Check the version
        shell: pwsh
        run: |
          if ('${{ inputs.version }}' -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.]+)?$') { throw "Version must look like 1.2.3 or 1.2.3-beta.1" }

      # ---- C#: Native AOT, self-contained Windows App SDK ----
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: dotnet/global.json
      - name: Publish the C# app
        working-directory: dotnet
        run: dotnet publish src/Guit.App -c Release -r ${{ matrix.rid }} -p:Platform=${{ matrix.platform }} -p:Version=${{ inputs.version }}

      # ---- Rust: windows-reactor, self-contained Windows App Runtime ----
      - name: Install the Rust target
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup target add ${{ matrix.target }}
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: rust-${{ matrix.target }}-${{ hashFiles('rust/Cargo.lock', 'rust/Cargo.toml') }}
      - name: Build the Rust app
        working-directory: rust
        run: cargo build --release -p guit --locked --target ${{ matrix.target }}

      # ---- One zip per app: the app folder, the measuring script, and a note saying what it is ----
      - name: Package
        shell: pwsh
        run: |
          $version = '${{ inputs.version }}'
          $rid = '${{ matrix.rid }}'
          $commit = '${{ github.sha }}'.Substring(0, 7)
          New-Item -ItemType Directory -Force -Path out | Out-Null

          # C#: the publish folder without debug symbols.
          $cs = "stage/guit-cs-$version-$rid"
          $publish = Get-ChildItem dotnet/artifacts/publish/Guit.App -Directory | Select-Object -First 1
          New-Item -ItemType Directory -Force -Path $cs | Out-Null
          Copy-Item (Join-Path $publish.FullName '*') $cs -Recurse -Exclude '*.pdb'

          # Rust: the exe and the runtime files staged beside it.
          $rs = "stage/guit-rs-$version-$rid"
          ./tools/stage-rust.ps1 -BuildDir rust/target/${{ matrix.target }}/release -Out $rs

          foreach ($app in @(@{ Dir = $cs; Exe = 'Guit.exe'; Name = 'C# (.NET Native AOT, WinUI 3)' }, @{ Dir = $rs; Exe = 'guit.exe'; Name = 'Rust (windows-reactor)' })) {
            Copy-Item tools/measure-startup.ps1, tools/measure-inbox.ps1 $app.Dir
            @"
          Guit $version, $($app.Name), $rid
          Built from commit $commit of https://github.com/${{ github.repository }}

          Run:      $($app.Exe)
          Measure:  powershell -ExecutionPolicy Bypass -File measure-startup.ps1 -Exe .\$($app.Exe) -Label "$($app.Name)"
          Signed in: powershell -ExecutionPolicy Bypass -File measure-inbox.ps1 -Exe .\$($app.Exe) -Label "$($app.Name)"

          Both builds are self-contained (nothing to install) and share one sign-in: signing in with
          either signs in both. The Rust build has fewer features than the C# build; compare like with
          like (start-up while signed out, or the inbox).
          "@ -replace '(?m)^          ', '' | Set-Content (Join-Path $app.Dir 'README.txt')
            Compress-Archive -Path (Join-Path $app.Dir '*') -DestinationPath "out/$(Split-Path $app.Dir -Leaf).zip"
          }

          Get-ChildItem out | ForEach-Object { "{0}: {1:N1} MB" -f $_.Name, ($_.Length / 1MB) } | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append

      # The same measurement people will run by hand, on this runner, for a first comparison.
      - name: Measure both
        shell: pwsh
        run: |
          ./tools/measure-startup.ps1 -Exe "stage/guit-cs-${{ inputs.version }}-${{ matrix.rid }}/Guit.exe" -Label "C# ${{ matrix.rid }}"
          ./tools/measure-startup.ps1 -Exe "stage/guit-rs-${{ inputs.version }}-${{ matrix.rid }}/guit.exe" -Label "Rust ${{ matrix.rid }}"

      - uses: actions/upload-artifact@v4
        with:
          name: guit-${{ inputs.version }}-${{ matrix.rid }}
          path: out/*.zip
          if-no-files-found: error

  release:
    name: GitHub Release
    if: ${{ inputs.publish_release }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ inputs.version }}" out/*.zip \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Guit ${{ inputs.version }}" \
            --notes "Side-by-side builds of the C# and Rust apps at ${{ github.sha }}. Each zip is self-contained and includes measure-startup.ps1."
