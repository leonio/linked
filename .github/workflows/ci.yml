name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  core:
    name: API + Core (tests, Native AOT smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Test Triage.Api
        run: dotnet test --project tests/Triage.Api.Tests -c Release
      - name: Test Triage.Core
        run: dotnet test --project tests/Triage.Core.Tests -c Release
      - name: Publish AOT smoke
        run: dotnet publish tests/Triage.AotSmoke -c Release -r linux-x64
      - name: Run AOT smoke
        run: ./artifacts/publish/Triage.AotSmoke/release_linux-x64/Triage.AotSmoke

  app:
    name: WinUI app (build, Native AOT publish)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Build
        run: dotnet build src/Triage.App -c Release -p:Platform=x64
      - name: Publish Native AOT
        run: dotnet publish src/Triage.App -c Release -r win-x64 -p:Platform=x64
      - name: Report binary size
        shell: pwsh
        run: |
          $dir = Get-ChildItem artifacts/publish/Triage.App -Directory | Select-Object -First 1
          $exe = Get-Item (Join-Path $dir.FullName 'Triage.exe')
          $total = (Get-ChildItem $dir.FullName -Recurse -File | Measure-Object Length -Sum).Sum
          "Triage.exe: {0:N1} MB; publish folder: {1:N1} MB" -f ($exe.Length / 1MB), ($total / 1MB) | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
      - name: Launch smoke test (the native exe must start and show a window)
        shell: pwsh
        run: |
          $dir = Get-ChildItem artifacts/publish/Triage.App -Directory | Select-Object -First 1
          $app = Start-Process -FilePath (Join-Path $dir.FullName 'Triage.exe') -PassThru
          Start-Sleep -Seconds 12
          $app.Refresh()
          if ($app.HasExited) { throw "Triage.exe exited during start-up with code $($app.ExitCode)" }
          $hasWindow = $app.MainWindowHandle -ne 0
          "Launch smoke: running after 12 s, window created: $hasWindow, working set: {0:N0} MB" -f ($app.WorkingSet64 / 1MB) | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
          Stop-Process -Id $app.Id -Force
          if (-not $hasWindow) { throw "Triage.exe started but never created a window" }
      - uses: actions/upload-artifact@v4
        with:
          name: Triage-win-x64
          path: artifacts/publish/Triage.App/
          if-no-files-found: error
