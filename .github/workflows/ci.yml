name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  core:
    name: API + Core (tests, Native AOT smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Test Guit.Api
        run: dotnet test --project tests/Guit.Api.Tests -c Release
      - name: Test Guit.Core
        run: dotnet test --project tests/Guit.Core.Tests -c Release
      - name: Publish AOT smoke
        run: dotnet publish tests/Guit.AotSmoke -c Release -r linux-x64
      - name: Run AOT smoke
        run: ./artifacts/publish/Guit.AotSmoke/release_linux-x64/Guit.AotSmoke

  app:
    name: WinUI app ${{ matrix.rid }} (build, Native AOT publish, launch)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # startup_budget_ms: the job fails when the median start-up time is over this.
          # Measured on these runners in November 2026: x64 about 210 ms, ARM64 about 290 ms.
          - rid: win-x64
            platform: x64
            os: windows-latest
            startup_budget_ms: 400
          - rid: win-arm64
            platform: ARM64
            os: windows-11-arm
            startup_budget_ms: 600
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Build
        run: dotnet build src/Guit.App -c Release -p:Platform=${{ matrix.platform }}
      - name: Publish Native AOT
        run: dotnet publish src/Guit.App -c Release -r ${{ matrix.rid }} -p:Platform=${{ matrix.platform }}
      - name: Report binary size
        shell: pwsh
        run: |
          $dir = Get-ChildItem artifacts/publish/Guit.App -Directory | Select-Object -First 1
          $exe = Get-Item (Join-Path $dir.FullName 'Guit.exe')
          $total = (Get-ChildItem $dir.FullName -Recurse -File | Measure-Object Length -Sum).Sum
          "Guit.exe: {0:N1} MB; publish folder: {1:N1} MB" -f ($exe.Length / 1MB), ($total / 1MB) | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
      - name: Launch and time start-up (the native exe must start and show a window)
        shell: pwsh
        env:
          STARTUP_BUDGET_MS: ${{ matrix.startup_budget_ms }}
        run: |
          # Start the app several times and time process start -> main window created.
          # The first run is discarded (cold disk cache); the median of the rest is reported.
          # STARTUP_BUDGET_MS (from the job matrix) fails the job when the median exceeds it.
          $dir = Get-ChildItem artifacts/publish/Guit.App -Directory | Select-Object -First 1
          $exe = Join-Path $dir.FullName 'Guit.exe'
          $times = @()
          $workingSet = 0
          foreach ($run in 1..6) {
            $watch = [Diagnostics.Stopwatch]::StartNew()
            $app = Start-Process -FilePath $exe -PassThru
            while ($app.MainWindowHandle -eq 0) {
              if ($app.HasExited) { throw "Guit.exe exited during start-up with code $($app.ExitCode)" }
              if ($watch.ElapsedMilliseconds -gt 30000) { Stop-Process -Id $app.Id -Force; throw "Guit.exe started but never created a window" }
              Start-Sleep -Milliseconds 5
              $app.Refresh()
            }
            $elapsed = $watch.ElapsedMilliseconds
            Start-Sleep -Seconds 2
            $app.Refresh()
            if ($app.HasExited) { throw "Guit.exe exited right after showing its window, code $($app.ExitCode)" }
            $workingSet = $app.WorkingSet64
            Stop-Process -Id $app.Id -Force
            $app.WaitForExit()
            if ($run -gt 1) { $times += $elapsed }
            "run ${run}: $elapsed ms"
          }
          $sorted = $times | Sort-Object
          $median = $sorted[[int][Math]::Floor($sorted.Count / 2)]
          "Start-up (process start to window): median {0} ms, min {1} ms, max {2} ms over {3} runs; working set {4:N0} MB" -f $median, $sorted[0], $sorted[-1], $sorted.Count, ($workingSet / 1MB) | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
          if ($env:STARTUP_BUDGET_MS -and $median -gt [int]$env:STARTUP_BUDGET_MS) {
            throw "Start-up median $median ms is over the budget of $env:STARTUP_BUDGET_MS ms"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: Guit-${{ matrix.rid }}
          path: artifacts/publish/Guit.App/
          if-no-files-found: error
