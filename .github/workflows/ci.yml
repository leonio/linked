name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  core:
    name: API + Core (tests, Native AOT smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: dotnet/global.json
      - name: Test Guit.Api
        working-directory: dotnet
        run: dotnet test --project tests/Guit.Api.Tests -c Release
      - name: Test Guit.Core
        working-directory: dotnet
        run: dotnet test --project tests/Guit.Core.Tests -c Release
      - name: Publish AOT smoke
        working-directory: dotnet
        run: dotnet publish tests/Guit.AotSmoke -c Release -r linux-x64
      - name: Run AOT smoke
        run: ./dotnet/artifacts/publish/Guit.AotSmoke/release_linux-x64/Guit.AotSmoke
      - name: Test the Rust core
        working-directory: rust
        run: cargo test -p guit-core --locked

  app:
    name: WinUI app ${{ matrix.rid }} (build, Native AOT publish, launch)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # startup_budget_ms: the job fails when the median start-up time is over this.
          # Measured on these runners in November 2026: x64 about 190-210 ms, ARM64 about 260-290 ms.
          - rid: win-x64
            platform: x64
            os: windows-latest
            startup_budget_ms: 400
          - rid: win-arm64
            platform: ARM64
            os: windows-11-arm
            startup_budget_ms: 600
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: dotnet/global.json
      - name: Build
        working-directory: dotnet
        run: dotnet build src/Guit.App -c Release -p:Platform=${{ matrix.platform }}
      - name: Publish Native AOT
        working-directory: dotnet
        run: dotnet publish src/Guit.App -c Release -r ${{ matrix.rid }} -p:Platform=${{ matrix.platform }}
      - name: Launch and time start-up (the native exe must start and show a window)
        shell: pwsh
        run: |
          $dir = Get-ChildItem dotnet/artifacts/publish/Guit.App -Directory | Select-Object -First 1
          ./tools/measure-startup.ps1 -Exe (Join-Path $dir.FullName 'Guit.exe') -Label "C# ${{ matrix.rid }}" -BudgetMs ${{ matrix.startup_budget_ms }}
      - uses: actions/upload-artifact@v4
        with:
          name: Guit-${{ matrix.rid }}
          path: dotnet/artifacts/publish/Guit.App/
          if-no-files-found: error

  rust:
    name: Rust app ${{ matrix.rid }} (build, launch)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            target: x86_64-pc-windows-msvc
            os: windows-latest
          - rid: win-arm64
            target: aarch64-pc-windows-msvc
            os: windows-11-arm
    steps:
      - uses: actions/checkout@v4
      - name: Install the Rust target
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup target add ${{ matrix.target }}
      # The release profile uses fat LTO over the windows crate: slow from cold, quick from cache.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: rust-${{ matrix.target }}-${{ hashFiles('rust/Cargo.lock', 'rust/Cargo.toml') }}
      - name: Build
        working-directory: rust
        run: cargo build --release -p guit --locked --target ${{ matrix.target }}
      - name: Stage
        shell: pwsh
        run: ./tools/stage-rust.ps1 -BuildDir rust/target/${{ matrix.target }}/release -Out artifacts/guit-rs
      # No budget yet: the first runs establish what normal is. Same script and method as the C# job.
      - name: Launch and time start-up (the exe must start and show a window)
        shell: pwsh
        run: ./tools/measure-startup.ps1 -Exe artifacts/guit-rs/guit.exe -Label "Rust ${{ matrix.rid }}"
      - uses: actions/upload-artifact@v4
        with:
          name: Guit-rs-${{ matrix.rid }}
          path: artifacts/guit-rs/
          if-no-files-found: error


  # Every green build on main replaces the "latest" pre-release, so the newest builds always have a fixed URL:
  #   https://github.com/<owner>/<repo>/releases/tag/latest
  # Each app folder is uploaded by the jobs above; this job zips them and attaches the zips with checksums.
  publish:
    name: Publish the latest builds
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: [core, app, rust]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: Guit-*
          path: apps
      - name: Zip each app
        run: |
          mkdir out
          for dir in apps/*/; do
            name=$(basename "$dir")                  # Guit-win-x64, Guit-rs-win-arm64, ...
            cp tools/measure-startup.ps1 tools/measure-inbox.ps1 "$dir"
            (cd "$dir" && zip -qr -X "$GITHUB_WORKSPACE/out/${name,,}.zip" . -x '*.pdb')
          done
          (cd out && sha256sum *.zip > SHA256SUMS.txt && cat SHA256SUMS.txt)
      - name: Replace the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest out/* \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Latest build (${GITHUB_SHA::7})" \
            --notes "Self-contained zips of the C# (guit-win-*) and Rust (guit-rs-win-*) apps built from $GITHUB_SHA. Replaced on every build of main."
